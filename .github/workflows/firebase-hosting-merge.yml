name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - frontend-integracion
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: angular/parking/package-lock.json
      - run: npm ci && npm run build
        working-directory: angular/parking
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNIPARKING_DEV }}
          channelId: live
          projectId: uniparking-dev
          entryPoint: angular/parking